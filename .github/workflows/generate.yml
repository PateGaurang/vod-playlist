name: Generate M3U Playlists

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate playlists
        run: node scripts/generate.js

      - name: Check generated files
        run: |
          echo "===== movies.m3u ====="
          cat docs/movies.m3u

          echo "===== series.m3u ====="
          cat docs/series.m3u

      - name: Commit generated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/movies.m3u docs/series.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "Update generated playlists"
            git push
          fi
